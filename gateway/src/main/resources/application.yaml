spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/users, /users/**
          filters:
            - RewritePath=/users(?<segment>/.*)?, /api/v1/users${segment}
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/orders, /orders/**
          filters:
            - RewritePath=/orders(?<segment>/.*)?, /api/v1/orders${segment}
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/payment
          filters:
            - RewritePath=/payment, /api/v1/payment
        - id: create-order
          uri: http://orchestrator-service:8085
          predicates:
            - Path=/create-order
