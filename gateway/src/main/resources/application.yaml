spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users, /users/**
          filters:
            - RewritePath=/users(?<segment>/.*)?, /api/v1/users${segment}
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/orders, /orders/**
          filters:
            - RewritePath=/orders(?<segment>/.*)?, /api/v1/orders${segment}